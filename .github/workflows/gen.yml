name: gen
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions:
  contents: read
# One group per ref, as ci.yml: a started main run always finishes, only the newest pending main
# run is kept, and a PR run cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Regenerates the grammar tables from the parser.c files pinned in grammars/grammars.lock and
  # uploads them as the artifact `grammars-gen`. Commit them with git (no build on the Mac); the
  # `test` job regenerates and fails on any diff.
  gen:
    if: github.event_name == 'workflow_dispatch'
    runs-on: github-arc-runner-set
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: gen-out
          push: false
          outputs: type=local,dest=gen-out
          provenance: false
          cache-from: type=gha,scope=gositter-rs-gen
          cache-to: type=gha,mode=max,scope=gositter-rs-gen
      - run: du -ab gen-out | sort -n | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grammars-gen
          path: gen-out
          if-no-files-found: error

  # Our tables against gositter's own Go tables (plan Task 6), on every push to main and on dispatch.
  grammar-parity:
    runs-on: github-arc-runner-set
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: grammar-parity
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=gositter-rs-grammar-parity
          cache-to: type=gha,mode=max,scope=gositter-rs-grammar-parity
